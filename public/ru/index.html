<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#080f1c"><meta name="description" content="Legit Assets — Steam Mini App"><title>Steam — Legit Assets</title><script src="https://telegram.org/js/telegram-web-app.js" defer></script><link rel="stylesheet" href="../style.css"><script type="module" src="../app.js"></script></head>
<body><a class="skip-link" href="#catalog">Каталог</a><div class="app-container">
<header class="app-header glass-card"><div class="header-top"><a href="./" class="brand"><span class="brand-mark">L<span>↗</span></span><span>LEGIT ASSETS<small>STEAM MINI APP</small></span></a><button class="cart-trigger" id="open-cart"><span data-icon="cart"></span><b id="cart-count">0</b><span class="sr-only" data-t="cart"></span></button></div><div class="header-bottom"><div><h1 data-t="title"></h1><span class="online-status"><span class="pulse-dot"></span><span data-t="headerHint"></span></span></div><div class="currency-switch" role="group" aria-label="Currency"><button type="button" data-currency="UAH" aria-pressed="true">₴ UAH</button><button type="button" data-currency="USD" aria-pressed="false">$ USD</button></div></div></header>
<div id="demo-banner" class="demo-banner" hidden data-t="demo"></div>
<main class="app-content"><section class="visual-intro glass-card" aria-label="Steam"><img class="intro-photo" src="../assets/decor/steam-deck.png" alt="Steam Deck" width="1250" height="1016" decoding="async"><div class="intro-shade"></div><div class="intro-copy"><img class="steam-mark" src="../assets/decor/steam.png" width="96" height="24" alt="Steam"><strong data-t="artTitle"></strong><span data-t="artSubtitle"></span></div></section><section id="catalog" class="catalog"><div class="section-heading"><h2 data-t="selectGame"></h2><span class="muted" data-t="gamesHint"></span></div><div id="game-grid" class="game-grid"></div></section>
<section class="listings" id="listings"><div class="listings-heading"><div><span class="eyebrow" data-t="listings"></span><h2 id="game-title">Counter-Strike 2</h2><p class="source-label"><span class="tiny-dot"></span><span id="source-label" data-t="live"></span><span id="updated"></span></p></div><button id="refresh" class="icon-button" data-label="refresh"><span data-icon="refresh"></span></button></div>
<form id="filters" class="filters glass-card" aria-label="Filters"><label class="search"><span data-icon="search"></span><input id="search" type="search" maxlength="100" data-placeholder="search"></label><div class="price-filters"><label><span class="sr-only" data-t="from"></span><input id="min" type="number" min="0.01" step="0.01" data-placeholder="from"></label><span class="range-dash">—</span><label><span class="sr-only" data-t="to"></span><input id="max" type="number" min="0.01" step="0.01" data-placeholder="to"></label><span id="filter-currency" class="filter-currency">₴</span></div><label class="sort"><span class="sr-only" data-t="sort"></span><select id="sort"><option value="pdate_to_down" data-t="newest"></option><option value="price_to_up" data-t="cheap"></option><option value="price_to_down" data-t="expensive"></option></select></label><label class="check-label"><input type="checkbox" id="no-vac"><span data-t="noVac"></span></label><div class="filter-actions"><button class="button primary" type="submit" data-t="apply"></button><button class="button subtle" id="reset" type="button" data-t="reset"></button></div></form>
<div class="results-bar"><span id="result-count" aria-live="polite"></span><span class="currency-label">UAH / USD</span></div><div id="notice" role="status"></div><div class="product-grid" id="products" aria-live="polite"></div><div class="load-more"><button id="load-more" class="button secondary" hidden data-t="loadMore"></button></div></section>
<footer class="page-footer"><p data-t="footerNote"></p><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Rates by ExchangeRate-API ↗</a><span>LEGIT ASSETS · STEAM</span></footer></main>
</div>
<button id="mobile-cart" class="app-footer glass-card"><span class="footer-summary"><span class="cart-count-badge"><span id="mobile-count">0</span> <span data-t="cartItems"></span></span><strong id="mobile-total">0 ₴</strong><small id="mobile-secondary">$0.00</small></span><span class="footer-button"><span data-icon="cart"></span><span data-t="cart"></span><span>→</span></span></button>
<dialog id="cart-dialog" class="drawer" aria-labelledby="cart-title"><div class="dialog-heading"><div><span class="eyebrow">LEGIT ASSETS</span><h2 id="cart-title" data-t="cart"></h2></div><button class="icon-button" data-close="cart-dialog" data-label="close">✕</button></div><div id="cart-items" class="cart-items"></div><div id="checkout-result" role="status"></div><div class="cart-bottom"><div class="total-line"><span data-t="total"></span><div><strong id="cart-total"></strong><small id="cart-total-secondary" class="secondary-price"></small></div></div><p class="muted" data-t="cartNote"></p><button id="checkout" class="button primary full" data-t="checkout"></button><button id="clear-cart" class="button subtle full" data-t="clear"></button></div></dialog>
<dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><button class="icon-button detail-close" data-close="detail-dialog" data-label="close">✕</button><div id="detail-content"></div></dialog><div id="toast" class="toast" role="status"></div></body></html>
